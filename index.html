<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子土星</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            background: radial-gradient(circle at center, #050505 0%, #0b0b10 100%);
        }

        #ui-layer {
            position: absolute; top: 30px; left: 30px; z-index: 10; pointer-events: none;
            transition: all 0.3s ease;
        }
        .glass-panel {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 2px;
            border-left: 2px solid #c5a059;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            max-width: 280px;
        }
        h1 {
            font-weight: 200; font-size: 1.8rem; margin: 0 0 10px 0;
            color: #e0cda7; letter-spacing: 4px; text-transform: uppercase;
        }
        .status-text { font-size: 0.85rem; color: #888; line-height: 1.6; font-family: monospace; }
        .highlight { color: #c5a059; font-weight: bold; }

        #author-btn {
            position: absolute; top: 40px; right: 40px; z-index: 20;
            pointer-events: auto; text-decoration: none; color: #c5a059;
            border: 1px solid rgba(197, 160, 89, 0.4);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px; font-size: 0.8rem; border-radius: 20px;
            transition: all 0.3s ease; backdrop-filter: blur(4px);
            letter-spacing: 1px; font-family: monospace;
        }

        #music-controls {
            position: absolute; bottom: 40px; left: 40px; z-index: 50;
            pointer-events: auto; display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.4); padding: 8px;
            border-radius: 50px; backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #music-controls.minimized {
            padding: 8px; border-color: rgba(197, 160, 89, 0.6);
            background: rgba(197, 160, 89, 0.15); box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        #player-content {
            display: flex; align-items: center; gap: 8px;
            overflow: hidden; max-width: 500px; opacity: 1; margin-left: 10px;
            transition: all 0.5s ease;
        }
        #music-controls.minimized #player-content { max-width: 0; opacity: 0; margin-left: 0; pointer-events: none; }

        .control-btn, #toggle-player-btn {
            background: transparent; border: none; color: #c5a059;
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .folder-btn { border-right: 1px solid rgba(197, 160, 89, 0.2); border-radius: 0; margin-right: 5px; width: 36px; }

        #music-display {
            background: transparent; color: #c5a059; padding: 0 10px;
            font-size: 0.8rem; min-width: 140px; text-align: center;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; flex-direction: column; justify-content: center;
            height: 36px; border-radius: 4px;
        }
        .song-title { font-weight: bold; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .song-time { font-size: 0.65rem; color: #888; font-family: monospace; margin-top: 2px; }

        /* 修改：增加 display: flex 和 gap 以排版新增的按钮 */
        #controls {
            position: absolute; bottom: 40px; right: 40px; z-index: 50;
            pointer-events: auto; transition: all 0.3s ease;
            display: flex; gap: 10px; 
        }
        button.fullscreen-btn {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(197, 160, 89, 0.3);
            color: #c5a059; padding: 12px 30px; font-size: 0.8rem;
            cursor: pointer; transition: all 0.4s ease;
            text-transform: uppercase; letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        
        .mobile-icon { display: none; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; color: #e0cda7;
            font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #music-toast {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            z-index: 60; background: rgba(197, 160, 89, 0.15);
            border: 1px solid rgba(197, 160, 89, 0.4); color: #e0cda7;
            padding: 10px 25px; border-radius: 30px; backdrop-filter: blur(8px);
            font-size: 0.9rem; white-space: nowrap; letter-spacing: 2px;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: all 0.5s ease; box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        #music-toast.show { opacity: 1; pointer-events: auto; top: 120px; }

        #fps-counter { position: absolute; top: 10px; right: 10px; font-size: 10px; font-family: monospace; color: #444; z-index: 5; }
        .input_video { display: none; }

        /* 新增：小行星悬浮文字标签样式 */
        .asteroid-label {
            position: absolute; top: 0; left: 0; z-index: 60;
            color: #e0cda7; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(197, 160, 89, 0.6);
            padding: 5px 12px; border-radius: 4px;
            font-size: 12px; letter-spacing: 2px;
            pointer-events: none; opacity: 0;
            transition: opacity 0.3s ease; white-space: nowrap;
            backdrop-filter: blur(4px); box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform-origin: center bottom;
        }

        @media (max-width: 768px) {
            #ui-layer { top: 15px; left: 15px; }
            .glass-panel { padding: 12px; max-width: 180px; }
            h1 { font-size: 1.2rem; }
            .status-text { font-size: 0.65rem; }
            #author-btn { top: 15px; right: 15px; padding: 5px 12px; font-size: 0.7rem; }
            #fps-counter { display: none; }
            #music-controls { bottom: 20px; left: 15px; padding: 5px; }
            .control-btn, #toggle-player-btn, .folder-btn { width: 30px; height: 30px; font-size: 1rem; }
            #music-display { min-width: 90px; padding: 0 5px; height: 32px; }
            .song-title { font-size: 0.7rem; max-width: 80px; }
            #controls { bottom: 20px; right: 15px; }
            button.fullscreen-btn { padding: 0; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
            .desktop-text { display: none; }
            .mobile-icon { display: block; }
        }
    </style>
</head>
<body>

    <video class="input_video"></video>
    
    <a id="author-btn" href="https://jizaijizai.github.io" target="_blank" onclick="safeOpenLink(event)">About</a>

    <div id="fps-counter">物理引擎: 极致模式 | 环境: 太阳系模拟</div>

    <div id="loading">
        正在构建粒子与启动视觉神经...<br>
        <span style="font-size: 0.7rem; color: #666; margin-top:5px; display:block;">(移动端请允许摄像头权限以开启手势)</span>
    </div>

    <div id="music-toast" onclick="forcePlayMusic()">
        ♪ 点击开启音乐
    </div>

    <div id="ui-layer">
        <div class="glass-panel">
            <h1>土星</h1>
            <div class="status-text">
                状态: <span id="status-indicator" class="highlight">待机</span>
                <br>
                > 轨道: 稳定<br>
                > 粒子: <span id="particle-count-display">加载中</span><br>
                > 交互: <span id="input-mode">检测中...</span>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">

    <div id="music-controls">
        <button id="toggle-player-btn" onclick="togglePlayerUI()" title="展开/收起">◀</button>
        <div id="player-content">
            <button class="control-btn folder-btn" onclick="triggerImport()" title="添加歌曲">➕</button>
            <button class="control-btn" onclick="playPrev()">⏮</button>
            <div id="music-display" onclick="toggleMusic()">
                <div class="song-title" id="display-title">读取列表中...</div>
                <div class="song-time" id="display-time">--:--</div>
            </div>
            <button class="control-btn" onclick="playNext()">⏭</button>
        </div>
    </div>

    <div id="controls">
        <button class="fullscreen-btn" onclick="addCustomAsteroid()">
            <span class="desktop-text">添加小行星</span>
            <span class="mobile-icon">☄️</span>
        </button>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">
            <span class="desktop-text">全屏沉浸体验</span>
            <span class="mobile-icon">⛶</span>
        </button>
    </div>

    <div id="canvas-container"></div>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size; attribute vec3 customColor; attribute float opacityAttr; attribute float orbitSpeed; attribute float isRing; attribute float aRandomId;
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        uniform float uTime; uniform float uScale; uniform float uRotationX;
        mat2 rotate2d(float _angle){ return mat2(cos(_angle),-sin(_angle), sin(_angle),cos(_angle)); }
        float hash(float n) { return fract(sin(n) * 43758.5453123); }
        void main() {
            float normScaleLOD = clamp((uScale - 0.15) / 2.35, 0.0, 1.0);
            float visibilityThreshold = 0.9 + pow(normScaleLOD, 1.2) * 0.1; 
            if (aRandomId > visibilityThreshold) { gl_Position = vec4(0.0); gl_PointSize = 0.0; return; }
            vec3 pos = position;
            if (isRing > 0.5) {
                float angleOffset = uTime * orbitSpeed * 0.2;
                vec2 rotatedXZ = rotate2d(angleOffset) * pos.xz;
                pos.x = rotatedXZ.x; pos.z = rotatedXZ.y;
            } else {
                float bodyAngle = uTime * 0.03;
                vec2 rotatedXZ = rotate2d(bodyAngle) * pos.xz;
                pos.x = rotatedXZ.x; pos.z = rotatedXZ.y;
            }
            float cx = cos(uRotationX); float sx = sin(uRotationX);
            float ry = pos.y * cx - pos.z * sx; float rz = pos.y * sx + pos.z * cx;
            pos.y = ry; pos.z = rz;
            vec4 mvPosition = modelViewMatrix * vec4(pos * uScale, 1.0);
            float dist = -mvPosition.z; vDist = dist;
            float chaosThreshold = 25.0; 
            if (dist < chaosThreshold && dist > 0.1) {
                float chaosIntensity = 1.0 - (dist / chaosThreshold); chaosIntensity = pow(chaosIntensity, 3.0);
                float highFreqTime = uTime * 40.0; 
                float noiseX = sin(highFreqTime + pos.x * 10.0) * hash(pos.y);
                float noiseY = cos(highFreqTime + pos.y * 10.0) * hash(pos.x);
                float noiseZ = sin(highFreqTime * 0.5) * hash(pos.z);
                mvPosition.xyz += vec3(noiseX, noiseY, noiseZ) * chaosIntensity * 3.0;
            }
            gl_Position = projectionMatrix * mvPosition;
            float pointSize = size * (350.0 / dist); pointSize *= 0.55; 
            if (isRing < 0.5 && dist < 50.0) pointSize *= 0.8; 
            gl_PointSize = clamp(pointSize, 0.0, 300.0);
            vColor = customColor; vOpacity = opacityAttr; vScaleFactor = uScale; vIsRing = isRing;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0; float r = dot(cxy, cxy); if (r > 1.0) discard;
            float glow = smoothstep(1.0, 0.4, r); 
            float t = clamp((vScaleFactor - 0.15) / 2.35, 0.0, 1.0);
            vec3 deepGold = vec3(0.35, 0.22, 0.05); float colorMix = smoothstep(0.1, 0.9, t);
            vec3 baseColor = mix(deepGold, vColor, colorMix);
            float brightness = 0.2 + 1.0 * t; float densityAlpha = 0.25 + 0.45 * smoothstep(0.0, 0.5, t);
            vec3 finalColor = baseColor * brightness;
            if (vDist < 40.0) {
                float closeMix = 1.0 - (vDist / 40.0);
                if (vIsRing < 0.5) { vec3 deepTexture = pow(vColor, vec3(1.4)) * 1.5; finalColor = mix(finalColor, deepTexture, closeMix * 0.8); } 
                else { finalColor += vec3(0.15, 0.12, 0.1) * closeMix; }
            }
            float depthAlpha = 1.0; if (vDist < 10.0) depthAlpha = smoothstep(0.0, 10.0, vDist);
            gl_FragColor = vec4(finalColor, glow * vOpacity * densityAlpha * depthAlpha);
        }
    </script>
    <script type="x-shader/x-vertex" id="starVertexShader">
        attribute float size; attribute vec3 customColor; varying vec3 vColor; uniform float uTime;
        void main() { vColor = customColor; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); float dist = -mvPosition.z; gl_PointSize = clamp(size * (1000.0 / dist), 1.0, 8.0); gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="starFragmentShader">
        varying vec3 vColor; uniform float uTime; float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        void main() { vec2 cxy = 2.0 * gl_PointCoord - 1.0; if (dot(cxy, cxy) > 1.0) discard; float noise = random(gl_FragCoord.xy); float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + noise * 10.0); float glow = pow(1.0 - dot(cxy,cxy), 1.5); gl_FragColor = vec4(vColor * twinkle, glow * 0.8); }
    </script>
    <script type="x-shader/x-vertex" id="planetVertexShader">
        varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="planetFragmentShader">
        uniform vec3 color1; uniform vec3 color2; uniform float noiseScale; uniform vec3 lightDir; uniform float atmosphere; varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition;
        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise(vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
        float fbm(vec2 st) { float value = 0.0; float amplitude = 0.5; for (int i = 0; i < 5; i++) { value += amplitude * noise(st); st *= 2.0; amplitude *= 0.5; } return value; }
        void main() { float n = fbm(vUv * noiseScale); vec3 albedo = mix(color1, color2, n); vec3 normal = normalize(vNormal); vec3 light = normalize(lightDir); float diff = max(dot(normal, light), 0.05); vec3 viewDir = normalize(vViewPosition); float fresnel = pow(1.0 - dot(viewDir, normal), 3.0); vec3 finalColor = albedo * diff + atmosphere * vec3(0.5, 0.6, 1.0) * fresnel; gl_FragColor = vec4(finalColor, 1.0); }
    </script>

    <script>
        const defaultPlaylist = [ "./music/take me hand.mp3" ];
        
        let activePlaylist = [...defaultPlaylist];
        let currentSongIndex = 0;
        const bgm = new Audio();
        bgm.volume = 0.5; bgm.loop = false;

        const musicControls = document.getElementById('music-controls');
        const toggleBtn = document.getElementById('toggle-player-btn');
        const displayTitle = document.getElementById('display-title');
        const displayTime = document.getElementById('display-time');
        const musicToast = document.getElementById('music-toast');
        const fileInput = document.getElementById('file-input');
        const inputModeEl = document.getElementById('input-mode');

        let isMinimized = false;
        let wasPlayingBeforeHide = false; 

        function safeOpenLink(event) {
            if (document.fullscreenElement) {
                event.preventDefault();
                document.exitFullscreen().then(() => {
                    setTimeout(() => window.open(event.target.href, '_blank'), 100);
                }).catch(() => window.open(event.target.href, '_blank'));
            }
        }

        function togglePlayerUI() {
            isMinimized = !isMinimized;
            if (isMinimized) { musicControls.classList.add('minimized'); toggleBtn.innerHTML = "♪"; } 
            else { musicControls.classList.remove('minimized'); toggleBtn.innerHTML = "◀"; }
        }
        musicControls.addEventListener('click', (e) => { if (isMinimized && e.target !== toggleBtn) togglePlayerUI(); });

        function triggerImport() { fileInput.click(); }
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                activePlaylist.push(...files);
                displayTitle.innerText = `已添加 ${files.length} 首`;
                setTimeout(() => {
                    if(bgm.paused && activePlaylist.length === files.length) loadSong(0);
                    else displayTitle.innerText = getSongName(activePlaylist[currentSongIndex]);
                }, 1500);
            }
        });

        function getSongName(item) {
            let rawName = "";
            if (typeof item === 'string') { try { rawName = decodeURIComponent(item.split('/').pop()); } catch(e) { rawName = item.split('/').pop(); } } 
            else if (item instanceof File) { rawName = item.name; } 
            else { return "未知歌曲"; }
            return rawName.replace(/\.[^/.]+$/, "").replace(/\s+/g, '_');
        }

        function loadSong(index) {
            if (activePlaylist.length === 0) { displayTitle.innerText = "请添加歌曲"; return; }
            if (index >= activePlaylist.length) currentSongIndex = 0;
            else if (index < 0) currentSongIndex = activePlaylist.length - 1;
            else currentSongIndex = index;
            const songItem = activePlaylist[currentSongIndex];
            bgm.src = (typeof songItem === 'string') ? songItem : URL.createObjectURL(songItem);
            displayTitle.innerText = getSongName(songItem);
            displayTime.innerText = "00:00";
        }

        bgm.onerror = function() {
            if (activePlaylist.length <= 1) { displayTitle.innerText = "无法播放"; return; }
            console.warn("Skip error song"); setTimeout(() => playNext(), 500);
        };

        function playNext() { loadSong(currentSongIndex + 1); bgm.play().then(() => updatePlayStatus(true)).catch(() => updatePlayStatus(false)); }
        function playPrev() { loadSong(currentSongIndex - 1); bgm.play().then(() => updatePlayStatus(true)).catch(() => updatePlayStatus(false)); }
        function toggleMusic() {
            if (activePlaylist.length === 0) return;
            if (bgm.paused) { bgm.play(); updatePlayStatus(true); } else { bgm.pause(); updatePlayStatus(false); }
        }
        function updatePlayStatus(isPlaying) { displayTitle.style.color = isPlaying ? "#fff" : "#c5a059"; }
        function forcePlayMusic() { bgm.play(); updatePlayStatus(true); musicToast.classList.remove('show'); }
        function formatTime(s) {
            if(isNaN(s)) return "00:00";
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
        }

        bgm.addEventListener('timeupdate', () => { if(bgm.duration) displayTime.innerText = formatTime(bgm.currentTime); });
        bgm.addEventListener('ended', playNext); 

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (!bgm.paused) { wasPlayingBeforeHide = true; bgm.pause(); updatePlayStatus(false); } else { wasPlayingBeforeHide = false; }
            } else {
                if (wasPlayingBeforeHide) { bgm.play(); updatePlayStatus(true); }
            }
        });

        window.addEventListener('load', () => {
            if (activePlaylist.length > 0) {
                loadSong(0);
                const p = bgm.play();
                if (p !== undefined) p.then(() => updatePlayStatus(true)).catch(() => { updatePlayStatus(false); musicToast.classList.add('show'); });
            } else { displayTitle.innerText = "点击 ➕ 导入"; }
        });

        // ================= 新增：小行星逻辑区 =================
        const customAsteroids = [];

        function addCustomAsteroid() {
            if (!particles) {
                alert("星系粒子仍在加载中，请稍后尝试...");
                return;
            }
            
            const text = prompt("为您的小行星设置一段专属文字:", "✨ 专属小行星");
            if (!text) return;
            
            // 计算随机轨道位置（散布在土星环 B1 到 A 环之间）
            const R = 18;
            const rr = R * (1.6 + Math.random() * 0.6); 
            const th = Math.random() * Math.PI * 2;
            const speed = 8.0 / Math.sqrt(rr); // 完美同步 Shader 中的轨道速度计算
            
            // 构建带发光感的小行星 Mesh
            const geo = new THREE.IcosahedronGeometry(0.6, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xc5a059, wireframe: true, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            
            // 创建跟随其上的 HTML 标签
            const label = document.createElement('div');
            label.className = 'asteroid-label';
            label.innerText = text;
            document.body.appendChild(label);
            
            // 保存基础几何状态以配合手势及Shader轨道变换
            mesh.userData = {
                basex: rr * Math.cos(th),
                basey: (Math.random() - 0.5) * 0.2, // Y轴轻微浮动
                basez: rr * Math.sin(th),
                speed: speed,
                label: label
            };
            
            // 成为粒子集的子层级，继承其 modelMatrix 的自转轴(rotation.z = 0.466)
            particles.add(mesh); 
            customAsteroids.push(mesh);
            
            alert("✅ 小行星注入成功！\n请通过手势放大画面，即可在土星光环带上观察到它。");
        }
        // =======================================================


        // 3D 核心
        let scene, camera, renderer, particles, stars, nebula, planetGroup, uniforms, starUniforms;
        let targetScale = 1.0, targetRotX = 0.4, currentScale = 1.0, currentRotX = 0.4, isHandDetected = false;
        const videoElement = document.getElementsByClassName('input_video')[0];
        const statusElement = document.getElementById('status-indicator');
        const loadingElement = document.getElementById('loading');
        const particleCountEl = document.getElementById('particle-count-display');
        const clock = new THREE.Clock();
        let autoIdleTime = 0;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const PARTICLE_COUNT = isMobile ? 400000 : 1200000; 
        
        function initThree() {
            particleCountEl.innerText = (PARTICLE_COUNT / 10000).toFixed(0) + "万";
            inputModeEl.innerText = isMobile ? "尝试调用摄像头" : "WebCam";

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020202, 0.00015);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 100; camera.lookAt(0, 0, 0);

            initSaturn(); initStarfield(); initPlanets();

            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function initSaturn() {
            const geometry = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3), cols = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT), opacities = new Float32Array(PARTICLE_COUNT);
            const speeds = new Float32Array(PARTICLE_COUNT), isRings = new Float32Array(PARTICLE_COUNT), rids = new Float32Array(PARTICLE_COUNT);
            
            const bodyColors = [new THREE.Color('#E3DAC5'), new THREE.Color('#C9A070'), new THREE.Color('#E3DAC5'), new THREE.Color('#B08D55')];
            const ringColors = { C: new THREE.Color('#2A2520'), B1: new THREE.Color('#CDBFA0'), B2: new THREE.Color('#DCCBBA'), Cas: new THREE.Color('#050505'), A: new THREE.Color('#989085'), F: new THREE.Color('#AFAFA0') };
            const R = 18;

            for(let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z, r, g, b, size, op, sp, ir;
                rids[i] = Math.random();
                if (i < PARTICLE_COUNT * 0.25) {
                    ir = 0.0; sp = 0.0;
                    const u = Math.random(), v = Math.random(), theta = 2*Math.PI*u, phi = Math.acos(2*v-1);
                    x = R * Math.sin(phi) * Math.cos(theta);
                    let rawY = R * Math.cos(phi);
                    z = R * Math.sin(phi) * Math.sin(theta);
                    y = rawY * 0.9;
                    let lat = (rawY/R + 1.0) * 0.5; 
                    let idx = Math.floor(lat * 4 + (Math.cos(lat*40.0)*0.8+Math.cos(lat*15.0)*0.4)) % 4;
                    if(idx<0) idx=0;
                    let c = bodyColors[idx];
                    r=c.r; g=c.g; b=c.b; size=1.0+Math.random()*0.8; op=0.8;
                } else {
                    ir = 1.0;
                    let zr = Math.random(), rr, rc;
                    if (zr < 0.15) { rr=R*(1.235+Math.random()*0.29); rc=ringColors.C; size=0.5; op=0.3; }
                    else if (zr < 0.65) { let t=Math.random(); rr=R*(1.525+t*0.425); rc=ringColors.B1.clone().lerp(ringColors.B2, t); size=0.8+Math.random()*0.6; op=0.85; if(Math.sin(rr*2.0)>0.8) op*=1.2; }
                    else if (zr < 0.69) { rr=R*(1.95+Math.random()*0.075); rc=ringColors.Cas; size=0.3; op=0.1; }
                    else if (zr < 0.99) { rr=R*(2.025+Math.random()*0.245); rc=ringColors.A; size=0.7; op=0.6; if(rr>R*2.2 && rr<R*2.21) op=0.1; }
                    else { rr=R*(2.32+Math.random()*0.02); rc=ringColors.F; size=1.0; op=0.7; }
                    let th = Math.random()*Math.PI*2;
                    x=rr*Math.cos(th); z=rr*Math.sin(th);
                    y=(Math.random()-0.5)*(rr>R*2.3?0.4:0.15);
                    r=rc.r; g=rc.g; b=rc.b; sp=8.0/Math.sqrt(rr);
                }
                pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z; cols[i*3]=r; cols[i*3+1]=g; cols[i*3+2]=b;
                sizes[i]=size; opacities[i]=op; speeds[i]=sp; isRings[i]=ir;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(cols, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacityAttr', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('orbitSpeed', new THREE.BufferAttribute(speeds, 1));
            geometry.setAttribute('isRing', new THREE.BufferAttribute(isRings, 1));
            geometry.setAttribute('aRandomId', new THREE.BufferAttribute(rids, 1));

            uniforms = { uTime: { value: 0 }, uScale: { value: 1.0 }, uRotationX: { value: 0.4 } };
            const mat = new THREE.ShaderMaterial({
                depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent, transparent: true
            });
            particles = new THREE.Points(geometry, mat);
            particles.rotation.z = 0.466; 
            scene.add(particles);
        }

        function initStarfield() {
            const sc = isMobile ? 15000 : 50000;
            const geo = new THREE.BufferGeometry(), pos = new Float32Array(sc*3), cols = new Float32Array(sc*3), sz = new Float32Array(sc);
            const colors = [new THREE.Color('#9bb0ff'), new THREE.Color('#ffffff'), new THREE.Color('#ffcc6f'), new THREE.Color('#ff7b7b')];
            for(let i=0; i<sc; i++) {
                let r=400+Math.random()*3000, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
                pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
                let ct=Math.random(), c=(ct>0.9?colors[0]:(ct>0.6?colors[1]:(ct>0.3?colors[2]:colors[3])));
                cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b; sz[i]=1.0+Math.random()*3.0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('customColor', new THREE.BufferAttribute(cols, 3)); geo.setAttribute('size', new THREE.BufferAttribute(sz, 1));
            starUniforms = { uTime: { value: 0 } };
            stars = new THREE.Points(geo, new THREE.ShaderMaterial({ uniforms: starUniforms, vertexShader: document.getElementById('starVertexShader').textContent, fragmentShader: document.getElementById('starFragmentShader').textContent, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
            scene.add(stars);

            if(!isMobile) {
                const nc=100, nGeo=new THREE.BufferGeometry(), nPos=new Float32Array(nc*3), nCols=new Float32Array(nc*3), nSz=new Float32Array(nc);
                for(let i=0; i<nc; i++) {
                    let r=800+Math.random()*2000, th=Math.random()*Math.PI*2, ph=Math.PI/2+(Math.random()-0.5)*1.5;
                    nPos[i*3]=r*Math.sin(ph)*Math.cos(th); nPos[i*3+1]=r*Math.cos(ph); nPos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
                    let c=new THREE.Color().setHSL(0.6+Math.random()*0.2,0.8,0.05);
                    nCols[i*3]=c.r; nCols[i*3+1]=c.g; nCols[i*3+2]=c.b; nSz[i]=400.0+Math.random()*600.0;
                }
                nGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3)); nGeo.setAttribute('customColor', new THREE.BufferAttribute(nCols, 3)); nGeo.setAttribute('size', new THREE.BufferAttribute(nSz, 1));
                nebula = new THREE.Points(nGeo, new THREE.ShaderMaterial({ uniforms: {}, vertexShader: document.getElementById('starVertexShader').textContent, fragmentShader: `varying vec3 vColor; void main(){ vec2 c=2.0*gl_PointCoord-1.0; if(dot(c,c)>1.0) discard; gl_FragColor=vec4(vColor, pow(1.0-dot(c,c),2.0)*0.1); }`, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
                scene.add(nebula);
            }
        }

        function initPlanets() {
            planetGroup = new THREE.Group(); scene.add(planetGroup);
            const vS = document.getElementById('planetVertexShader').textContent, fS = document.getElementById('planetFragmentShader').textContent;
            const mkP = (c1,c2,ns,p,r,a) => {
                const segs = isMobile ? 32 : 48;
                const m = new THREE.Mesh(new THREE.SphereGeometry(r,segs,segs), new THREE.ShaderMaterial({ uniforms:{color1:{value:c1},color2:{value:c2},noiseScale:{value:ns},lightDir:{value:new THREE.Vector3(1,0.5,1)},atmosphere:{value:a}}, vertexShader:vS, fragmentShader:fS }));
                m.position.set(p.x,p.y,p.z); planetGroup.add(m);
            };
            mkP(new THREE.Color('#b33a00'), new THREE.Color('#d16830'), 8.0, {x:-300,y:120,z:-450}, 10, 0.3);
            mkP(new THREE.Color('#001e4d'), new THREE.Color('#ffffff'), 5.0, {x:380,y:-100,z:-600}, 14, 0.6);
            mkP(new THREE.Color('#666666'), new THREE.Color('#aaaaaa'), 15.0, {x:-180,y:-220,z:-350}, 6, 0.1);
        }

        function animate() {
            requestAnimationFrame(animate);
            const et = clock.getElapsedTime();
            uniforms.uTime.value = et; starUniforms.uTime.value = et;
            if(stars) stars.rotation.y = et*0.005; if(nebula) nebula.rotation.y = et*0.003;
            if(planetGroup) { planetGroup.children.forEach((p,i)=>p.rotation.y=et*(0.05+i*0.02)); planetGroup.rotation.y=Math.sin(et*0.05)*0.02; }

            if (!isHandDetected) {
                autoIdleTime += 0.005;
                targetScale = 1.0 + Math.sin(autoIdleTime) * 0.2; targetRotX = 0.4 + Math.sin(autoIdleTime * 0.3) * 0.15;
                statusElement.innerHTML = "系统状态: 自动巡航<br>输入信号: 等待中..."; statusElement.style.color = "#666";
            } else {
                statusElement.innerHTML = "系统状态: 手动接管<br>输入信号: <span class='highlight'>已锁定</span>"; statusElement.style.color = "#c5a059";
            }
            currentScale += (targetScale - currentScale) * 0.08; currentRotX += (targetRotX - currentRotX) * 0.08;
            uniforms.uScale.value = currentScale; uniforms.uRotationX.value = currentRotX;
            
            // ================= 新增：实时同步小行星矩阵与 UI 渲染 =================
            customAsteroids.forEach(ast => {
                // 1. 同步 Shader 内的光环 Y 轴公转偏角计算
                let angle = et * ast.userData.speed * 0.2;
                let x = Math.cos(angle) * ast.userData.basex - Math.sin(angle) * ast.userData.basez;
                let z = Math.sin(angle) * ast.userData.basex + Math.cos(angle) * ast.userData.basez;
                let y = ast.userData.basey;
                
                // 2. 同步 Shader 内的 X 轴手势倾斜计算
                let cx = Math.cos(currentRotX), sx = Math.sin(currentRotX);
                let ry = y * cx - z * sx;
                let rz = y * sx + z * cx;
                
                // 3. 赋予矩阵，将 uScale 同样叠加
                ast.position.set(x * currentScale, ry * currentScale, rz * currentScale);
                ast.scale.setScalar(currentScale); 
                
                // 4. 当手势拉大视角（currentScale > 1.5）时浮现名字标签
                if (currentScale > 1.5) {
                    ast.updateMatrixWorld();
                    let vec = new THREE.Vector3();
                    vec.setFromMatrixPosition(ast.matrixWorld);
                    vec.project(camera);
                    
                    // 防遮挡（绕到镜头后方时隐藏）
                    if (vec.z > 1.0 || vec.z < -1.0) {
                        ast.userData.label.style.opacity = 0;
                    } else {
                        let screenX = (vec.x * 0.5 + 0.5) * window.innerWidth;
                        let screenY = -(vec.y * 0.5 - 0.5) * window.innerHeight;
                        // 通过 translate 跟随坐标原点，并略微向上方偏移防遮挡行星本身
                        ast.userData.label.style.transform = `translate(-50%, -100%) translate(${screenX}px, ${screenY - 20}px)`;
                        ast.userData.label.style.opacity = 1;
                    }
                } else {
                    ast.userData.label.style.opacity = 0;
                }
            });
            // ====================================================================

            renderer.render(scene, camera);
        }

        // 尝试加载摄像头 (所有平台)
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({maxNumHands: 1, modelComplexity: isMobile ? 0 : 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7});
            
            hands.onResults(res => {
                loadingElement.style.display = 'none'; 
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    isHandDetected = true; const h = res.multiHandLandmarks[0];
                    const d = Math.sqrt((h[4].x-h[8].x)**2 + (h[4].y-h[8].y)**2);
                    targetScale = 0.15 + Math.max(0, Math.min(1, (d - 0.02) / 0.25)) * 2.35;
                    targetRotX = -0.6 + Math.max(0, Math.min(1, (h[9].y - 0.1) / 0.8)) * 1.6;
                } else isHandDetected = false;
            });

            const cam = new Camera(videoElement, {onFrame: async () => await hands.send({image: videoElement}), width: 640, height: 480});
            cam.start().catch(e => { 
                console.log("摄像头启动失败:", e); 
                loadingElement.style.display = 'none'; 
                inputModeEl.innerText = "自动巡航 (无权限)";
                alert("无法获取到摄像头权限! 已自动切换为自动巡航模式");
            });
        } else {
            loadingElement.style.display = 'none'; 
            inputModeEl.innerText = "自动巡航 (不支持API)";
            alert("您的浏览器不支持摄像头访问，已自动切换为自动巡航模式");
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        initThree();
    </script>
</body>
</html>
