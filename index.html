<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手控粒子土星</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            background: radial-gradient(circle at center, #050505 0%, #0b0b10 100%);
        }

        #ui-layer {
            position: absolute; top: 30px; left: 30px; z-index: 10; pointer-events: none;
            transition: all 0.3s ease;
        }
        .glass-panel {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 2px;
            border-left: 2px solid #c5a059;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            max-width: 280px;
        }
        h1 {
            font-weight: 200; font-size: 1.8rem; margin: 0 0 10px 0;
            color: #e0cda7; letter-spacing: 4px; text-transform: uppercase;
        }
        .status-text { font-size: 0.85rem; color: #888; line-height: 1.6; font-family: monospace; }
        .highlight { color: #c5a059; font-weight: bold; }

        #author-btn {
            position: absolute; top: 40px; right: 40px; z-index: 20;
            pointer-events: auto; text-decoration: none; color: #c5a059;
            border: 1px solid rgba(197, 160, 89, 0.4);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px; font-size: 0.8rem; border-radius: 20px;
            transition: all 0.3s ease; backdrop-filter: blur(4px);
            letter-spacing: 1px; font-family: monospace;
        }

        #music-controls {
            position: absolute; bottom: 40px; left: 40px; z-index: 50;
            pointer-events: auto; display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.4); padding: 8px;
            border-radius: 50px; backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #music-controls.minimized {
            padding: 8px; border-color: rgba(197, 160, 89, 0.6);
            background: rgba(197, 160, 89, 0.15); box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        #player-content {
            display: flex; align-items: center; gap: 8px;
            overflow: hidden; max-width: 500px; opacity: 1; margin-left: 10px;
            transition: all 0.5s ease;
        }
        #music-controls.minimized #player-content { max-width: 0; opacity: 0; margin-left: 0; pointer-events: none; }

        .control-btn, #toggle-player-btn {
            background: transparent; border: none; color: #c5a059;
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .folder-btn { border-right: 1px solid rgba(197, 160, 89, 0.2); border-radius: 0; margin-right: 5px; width: 36px; }

        #music-display {
            background: transparent; color: #c5a059; padding: 0 10px;
            font-size: 0.8rem; min-width: 140px; text-align: center;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; flex-direction: column; justify-content: center;
            height: 36px; border-radius: 4px;
        }
        .song-title { font-weight: bold; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .song-time { font-size: 0.65rem; color: #888; font-family: monospace; margin-top: 2px; }

        #controls {
            position: absolute; bottom: 40px; right: 40px; z-index: 50;
            pointer-events: auto; transition: all 0.3s ease;
            display: flex; gap: 10px; 
        }
        button.fullscreen-btn {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(197, 160, 89, 0.3);
            color: #c5a059; padding: 12px 30px; font-size: 0.8rem;
            cursor: pointer; transition: all 0.4s ease;
            text-transform: uppercase; letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        
        .mobile-icon { display: none; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; color: #e0cda7;
            font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #music-toast {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            z-index: 60; background: rgba(197, 160, 89, 0.15);
            border: 1px solid rgba(197, 160, 89, 0.4); color: #e0cda7;
            padding: 10px 25px; border-radius: 30px; backdrop-filter: blur(8px);
            font-size: 0.9rem; white-space: nowrap; letter-spacing: 2px;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: all 0.5s ease; box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        #music-toast.show { opacity: 1; pointer-events: auto; top: 120px; }

        #fps-counter { position: absolute; top: 10px; right: 10px; font-size: 10px; font-family: monospace; color: #444; z-index: 5; }
        .input_video { display: none; }

        .asteroid-label {
            position: absolute; top: 0; left: 0; z-index: 60;
            color: #e0cda7; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(197, 160, 89, 0.6);
            padding: 5px 12px; border-radius: 4px;
            font-size: 12px; letter-spacing: 2px;
            pointer-events: none; opacity: 0;
            transition: opacity 0.3s ease; white-space: nowrap;
            backdrop-filter: blur(4px); box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform-origin: center bottom;
        }

        /* 新增：弹幕样式 */
        .danmaku-item {
            position: absolute; right: -300px;
            color: #e0cda7; font-size: 16px; font-weight: bold;
            letter-spacing: 2px; white-space: nowrap;
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.9);
            z-index: 1000; animation: danmakuFly 6s linear forwards;
            pointer-events: none; padding: 8px 20px;
            background: rgba(0, 0, 0, 0.5); border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.5); backdrop-filter: blur(4px);
        }
        @keyframes danmakuFly { to { right: 110vw; } }

        @media (max-width: 768px) {
            #ui-layer { top: 15px; left: 15px; }
            .glass-panel { padding: 12px; max-width: 180px; }
            h1 { font-size: 1.2rem; }
            .status-text { font-size: 0.65rem; }
            #author-btn { top: 15px; right: 15px; padding: 5px 12px; font-size: 0.7rem; }
            #fps-counter { display: none; }
            #music-controls { bottom: 20px; left: 15px; padding: 5px; }
            .control-btn, #toggle-player-btn, .folder-btn { width: 30px; height: 30px; font-size: 1rem; }
            #music-display { min-width: 90px; padding: 0 5px; height: 32px; }
            .song-title { font-size: 0.7rem; max-width: 80px; }
            #controls { bottom: 20px; right: 15px; }
            button.fullscreen-btn { padding: 0; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
            .desktop-text { display: none; }
            .mobile-icon { display: block; }
        }
    </style>
</head>
<body>

    <video class="input_video" autoplay playsinline muted></video>
    
    <a id="author-btn" href="https://jizaijizai.github.io" target="_blank" onclick="safeOpenLink(event)">About</a>

    <div id="fps-counter">物理引擎: 极致模式 | 环境: 太阳系模拟</div>

    <div id="loading">
        正在构建粒子与启动视觉神经...<br>
        <span style="font-size: 0.7rem; color: #666; margin-top:5px; display:block;">(移动端请允许摄像头权限以开启手势)</span>
    </div>

    <div id="music-toast" onclick="forcePlayMusic()">♪ 点击开启音乐</div>

    <div id="ui-layer">
        <div class="glass-panel">
            <h1>土星</h1>
            <div class="status-text">
                状态: <span id="status-indicator" class="highlight">待机</span>
                <br>
                > 轨道: 稳定<br>
                > 粒子: <span id="particle-count-display">加载中</span><br>
                > 交互: <span id="input-mode">检测中...</span>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">

    <div id="music-controls">
        <button id="toggle-player-btn" onclick="togglePlayerUI()" title="展开/收起">◀</button>
        <div id="player-content">
            <button class="control-btn folder-btn" onclick="triggerImport()" title="添加歌曲">➕</button>
            <button class="control-btn" onclick="playPrev()">⏮</button>
            <div id="music-display" onclick="toggleMusic()">
                <div class="song-title" id="display-title">读取列表中...</div>
                <div class="song-time" id="display-time">--:--</div>
            </div>
            <button class="control-btn" onclick="playNext()">⏭</button>
        </div>
    </div>

    <div id="controls">
        <button class="fullscreen-btn" onclick="addCustomAsteroid()">
            <span class="desktop-text">添加小行星</span>
            <span class="mobile-icon">☄️</span>
        </button>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">
            <span class="desktop-text">全屏沉浸体验</span>
            <span class="mobile-icon">⛶</span>
        </button>
    </div>

    <div id="canvas-container"></div>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size; attribute vec3 customColor; attribute float opacityAttr; attribute float orbitSpeed; attribute float isRing; attribute float aRandomId;
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        uniform float uTime; uniform float uScale; uniform float uRotationX; uniform float uHeartMorph;
        mat2 rotate2d(float _angle){ return mat2(cos(_angle),-sin(_angle), sin(_angle),cos(_angle)); }
        float hash(float n) { return fract(sin(n) * 43758.5453123); }
        void main() {
            float normScaleLOD = clamp((uScale - 0.15) / 2.35, 0.0, 1.0);
            float visibilityThreshold = 0.9 + pow(normScaleLOD, 1.2) * 0.1; 
            if (aRandomId > visibilityThreshold) { gl_Position = vec4(0.0); gl_PointSize = 0.0; return; }
            vec3 pos = position;
            if (isRing > 0.5) {
                // 改造环轨道计算，支持向心形形变过渡
                float baseTh = atan(pos.z, pos.x);
                float r_circ = length(pos.xz);
                float animTh = baseTh + uTime * orbitSpeed * 0.2;
                
                vec2 circPos = vec2(cos(animTh), sin(animTh)) * r_circ;
                
                // 心形参数方程转换
                float hx = pow(sin(animTh), 3.0);
                float hz = -(13.0*cos(animTh) - 5.0*cos(2.0*animTh) - 2.0*cos(3.0*animTh) - cos(4.0*animTh)) / 16.0;
                vec2 heartPos = vec2(hx, hz) * r_circ * 1.2; 
                
                vec2 finalXZ = mix(circPos, heartPos, uHeartMorph);
                pos.x = finalXZ.x; pos.z = finalXZ.y;
            } else {
                float bodyAngle = uTime * 0.03;
                vec2 rotatedXZ = rotate2d(bodyAngle) * pos.xz;
                pos.x = rotatedXZ.x; pos.z = rotatedXZ.y;
            }
            float cx = cos(uRotationX); float sx = sin(uRotationX);
            float ry = pos.y * cx - pos.z * sx; float rz = pos.y * sx + pos.z * cx;
            pos.y = ry; pos.z = rz;
            vec4 mvPosition = modelViewMatrix * vec4(pos * uScale, 1.0);
            float dist = -mvPosition.z; vDist = dist;
            float chaosThreshold = 25.0; 
            if (dist < chaosThreshold && dist > 0.1) {
                float chaosIntensity = 1.0 - (dist / chaosThreshold); chaosIntensity = pow(chaosIntensity, 3.0);
                float highFreqTime = uTime * 40.0; 
                float noiseX = sin(highFreqTime + pos.x * 10.0) * hash(pos.y);
                float noiseY = cos(highFreqTime + pos.y * 10.0) * hash(pos.x);
                float noiseZ = sin(highFreqTime * 0.5) * hash(pos.z);
                mvPosition.xyz += vec3(noiseX, noiseY, noiseZ) * chaosIntensity * 3.0;
            }
            gl_Position = projectionMatrix * mvPosition;
            float pointSize = size * (350.0 / dist); pointSize *= 0.55; 
            if (isRing < 0.5 && dist < 50.0) pointSize *= 0.8; 
            gl_PointSize = clamp(pointSize, 0.0, 300.0);
            vColor = customColor; vOpacity = opacityAttr; vScaleFactor = uScale; vIsRing = isRing;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0; float r = dot(cxy, cxy); if (r > 1.0) discard;
            float glow = smoothstep(1.0, 0.4, r); 
            float t = clamp((vScaleFactor - 0.15) / 2.35, 0.0, 1.0);
            vec3 deepGold = vec3(0.35, 0.22, 0.05); float colorMix = smoothstep(0.1, 0.9, t);
            vec3 baseColor = mix(deepGold, vColor, colorMix);
            float brightness = 0.2 + 1.0 * t; float densityAlpha = 0.25 + 0.45 * smoothstep(0.0, 0.5, t);
            vec3 finalColor = baseColor * brightness;
            if (vDist < 40.0) {
                float closeMix = 1.0 - (vDist / 40.0);
                if (vIsRing < 0.5) { vec3 deepTexture = pow(vColor, vec3(1.4)) * 1.5; finalColor = mix(finalColor, deepTexture, closeMix * 0.8); } 
                else { finalColor += vec3(0.15, 0.12, 0.1) * closeMix; }
            }
            float depthAlpha = 1.0; if (vDist < 10.0) depthAlpha = smoothstep(0.0, 10.0, vDist);
            gl_FragColor = vec4(finalColor, glow * vOpacity * densityAlpha * depthAlpha);
        }
    </script>
    <script type="x-shader/x-vertex" id="starVertexShader">
        attribute float size; attribute vec3 customColor; varying vec3 vColor; uniform float uTime;
        void main() { vColor = customColor; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); float dist = -mvPosition.z; gl_PointSize = clamp(size * (1000.0 / dist), 1.0, 8.0); gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="starFragmentShader">
        varying vec3 vColor; uniform float uTime; float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        void main() { vec2 cxy = 2.0 * gl_PointCoord - 1.0; if (dot(cxy, cxy) > 1.0) discard; float noise = random(gl_FragCoord.xy); float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + noise * 10.0); float glow = pow(1.0 - dot(cxy,cxy), 1.5); gl_FragColor = vec4(vColor * twinkle, glow * 0.8); }
    </script>
    <script type="x-shader/x-vertex" id="planetVertexShader">
        varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="planetFragmentShader">
        uniform vec3 color1; uniform vec3 color2; uniform float noiseScale; uniform vec3 lightDir; uniform float atmosphere; varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition;
        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise(vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
        float fbm(vec2 st) { float value = 0.0; float amplitude = 0.5; for (int i = 0; i < 5; i++) { value += amplitude * noise(st); st *= 2.0; amplitude *= 0.5; } return value; }
        void main() { float n = fbm(vUv * noiseScale); vec3 albedo = mix(color1, color2, n); vec3 normal = normalize(vNormal); vec3 light = normalize(lightDir); float diff = max(dot(normal, light), 0.05); vec3 viewDir = normalize(vViewPosition); float fresnel = pow(1.0 - dot(viewDir, normal), 3.0); vec3 finalColor = albedo * diff + atmosphere * vec3(0.5, 0.6, 1.0) * fresnel; gl_FragColor = vec4(finalColor, 1.0); }
    </script>

    <script>
        // 集中管理硬编码参数
        const CONFIG = {
            MAX_ASTEROIDS: 100,
            PARTICLE_COUNT_DESKTOP: 1200000,
            PARTICLE_COUNT_MOBILE: 400000,
            TRAIL_MAX_PARTICLES: 3000,
            PLANET_RADIUS: 18,
            RESIZE_DEBOUNCE_MS: 200,
            MEDIAPIPE_TIMEOUT_MS: 15000
        };

        function customToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid #c5a059;color:#e0cda7;padding:10px 20px;border-radius:20px;z-index:10000;font-size:14px;pointer-events:none;opacity:0;transition:opacity 0.3s;text-align:center;box-shadow:0 0 15px rgba(0,0,0,0.8);';
            document.body.appendChild(toast);
            toast.offsetHeight;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        function customPrompt(message, defaultValue, callback) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);';
            
            const box = document.createElement('div');
            box.style.cssText = 'background:rgba(20,20,20,0.9);border:1px solid #c5a059;padding:25px;border-radius:8px;text-align:center;color:#e0cda7;font-family:monospace;box-shadow:0 0 20px rgba(0,0,0,0.8);min-width:260px;';
            
            const msg = document.createElement('div');
            msg.innerText = message;
            msg.style.marginBottom = '15px';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.value = defaultValue;
            input.style.cssText = 'width:80%;padding:10px;background:rgba(0,0,0,0.5);border:1px solid rgba(197,160,89,0.5);color:#fff;outline:none;text-align:center;margin-bottom:20px;border-radius:4px;';
            
            const btnWrap = document.createElement('div');
            
            const btnCancel = document.createElement('button');
            btnCancel.innerText = '取消';
            btnCancel.style.cssText = 'background:rgba(255,255,255,0.05);border:1px solid #666;color:#ccc;padding:8px 15px;cursor:pointer;margin:0 5px;border-radius:4px;transition:all 0.3s;';
            
            const btnOk = document.createElement('button');
            btnOk.innerText = '确认注入';
            btnOk.style.cssText = 'background:rgba(197,160,89,0.2);border:1px solid #c5a059;color:#c5a059;padding:8px 15px;cursor:pointer;margin:0 5px;border-radius:4px;transition:all 0.3s;';
            
            btnWrap.appendChild(btnCancel);
            btnWrap.appendChild(btnOk);
            box.appendChild(msg); box.appendChild(input); box.appendChild(btnWrap);
            overlay.appendChild(box); document.body.appendChild(overlay);
            
            input.focus();
            function close(val) { document.body.removeChild(overlay); callback(val); }
            btnOk.onclick = () => close(input.value);
            btnCancel.onclick = () => close(null);

            // 自定义弹窗的键盘无障碍支持
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') { close(input.value); }
                if(e.key === 'Escape') { close(null); }
            });
        }

        // 深度内存清理
        function deepDisposeObject(obj) {
            if (!obj) return;
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else obj.material.dispose();
            }
            if (obj.children) obj.children.forEach(child => deepDisposeObject(child));
        }

        const defaultPlaylist = [ 
        "./music/take me hand.mp3",
        "./music/鲸.mp3"
         ];
        let activePlaylist = [...defaultPlaylist];
        let currentSongIndex = 0;
        const bgm = new Audio();
        bgm.volume = 0.5; bgm.loop = false;

        const musicControls = document.getElementById('music-controls');
        const toggleBtn = document.getElementById('toggle-player-btn');
        const displayTitle = document.getElementById('display-title');
        const displayTime = document.getElementById('display-time');
        const musicToast = document.getElementById('music-toast');
        const fileInput = document.getElementById('file-input');
        const inputModeEl = document.getElementById('input-mode');
        let isMinimized = false; let wasPlayingBeforeHide = false; 

        function safeOpenLink(event) {
            if (document.fullscreenElement) {
                event.preventDefault();
                document.exitFullscreen().then(() => { setTimeout(() => window.open(event.target.href, '_blank'), 100); }).catch(() => window.open(event.target.href, '_blank'));
            }
        }
        function togglePlayerUI() {
            isMinimized = !isMinimized;
            if (isMinimized) { musicControls.classList.add('minimized'); toggleBtn.innerHTML = "♪"; } 
            else { musicControls.classList.remove('minimized'); toggleBtn.innerHTML = "◀"; }
        }
        musicControls.addEventListener('click', (e) => { if (isMinimized && e.target !== toggleBtn) togglePlayerUI(); });
        function triggerImport() { fileInput.click(); }
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                activePlaylist.push(...files); displayTitle.innerText = `已添加 ${files.length} 首`;
                setTimeout(() => { if(bgm.paused && activePlaylist.length === files.length) loadSong(0); else displayTitle.innerText = getSongName(activePlaylist[currentSongIndex]); }, 1500);

                    ast.userData.angleOffset += delta * ast.userData.speed * 0.2; ast.material.opacity = 0.9;
                } else if (state === 1) { // 减速变亮
                    let t = Math.min(ast.userData.escapeTimer / 2.0, 1.0);
                    ast.userData.speed = ast.userData.origSpeed * (1.0 - t); // 速度降为0
                    ast.userData.angleOffset += delta * ast.userData.speed * 0.2;
                    ast.material.opacity = 0.9 + t * 1.5; // 变亮
                    if (t >= 1.0) {
                        ast.userData.escapeState = 2; ast.userData.escapeTimer = 0;
                        ast.userData.flyDir = new THREE.Vector3(1, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2).normalize();
                    }
                } else if (state === 2) { // 飞出 (向右由慢到快)
                    let t = ast.userData.escapeTimer; let speed = t * 150.0;
                    ast.position.addScaledVector(ast.userData.flyDir, speed * delta);
                    globalTrails.addPoint(ast.position, ast.userData.trailColor);
                    if (ast.position.x > 300) { ast.userData.escapeState = 3; triggerDanmaku(ast.userData.label.innerText); }
                } else if (state === 4) { // 飞回
                    let t = Math.min(ast.userData.escapeTimer / 2.0, 1.0);
                    ast.userData.angleOffset += delta * ast.userData.origSpeed * (1.0-t) * 0.2;
                    
                    let animTh = baseTh + ast.userData.angleOffset;
                    let cx_c = Math.cos(animTh)*r_circ, cz_c = Math.sin(animTh)*r_circ;
                    let hx = Math.pow(Math.sin(animTh), 3.0), hz = -(13.0*Math.cos(animTh)-5.0*Math.cos(2.0*animTh)-2.0*Math.cos(3.0*animTh)-Math.cos(4.0*animTh))/16.0;
                    let finalX = cx_c * (1-currentHeartMorph) + hx*r_circ*1.2 * currentHeartMorph;
                    let finalZ = cz_c * (1-currentHeartMorph) + hz*r_circ*1.2 * currentHeartMorph;
                    
                    let rx = Math.cos(currentRotX), sx = Math.sin(currentRotX);
                    let ry = ast.userData.basey * rx - finalZ * sx, rz = ast.userData.basey * sx + finalZ * rx;
                    let targetWorldPos = new THREE.Vector3(finalX * currentScale, ry * currentScale, rz * currentScale);
                    
                    let easeOut = 1 - Math.pow(1 - t, 5); // 飞回由快到慢
                    ast.position.lerpVectors(ast.userData.startReturnPos, targetWorldPos, easeOut);
                    globalTrails.addPoint(ast.position, ast.userData.trailColor);
                    ast.material.opacity = 2.4 - t * 1.5; 
                    
                    if (t >= 1.0) { ast.userData.escapeState = 0; ast.userData.speed = ast.userData.origSpeed; }
                }
                
                // 普通与减速状态下跟随轨道变换
                if (state === 0 || state === 1) {
                    let animTh = baseTh + ast.userData.angleOffset;
                    let circX = Math.cos(animTh) * r_circ; let circZ = Math.sin(animTh) * r_circ;
                    let hx = Math.pow(Math.sin(animTh), 3.0); let hz = -(13.0*Math.cos(animTh)-5.0*Math.cos(2.0*animTh)-2.0*Math.cos(3.0*animTh)-Math.cos(4.0*animTh))/16.0;
                    let finalX = circX * (1 - currentHeartMorph) + (hx * r_circ * 1.2) * currentHeartMorph;
                    let finalZ = circZ * (1 - currentHeartMorph) + (hz * r_circ * 1.2) * currentHeartMorph;
                    
                    let cx = Math.cos(currentRotX), sx = Math.sin(currentRotX);
                    let ry = ast.userData.basey * cx - finalZ * sx; let rz = ast.userData.basey * sx + finalZ * cx;
                    ast.position.set(finalX * currentScale, ry * currentScale, rz * currentScale);
                }
                
                ast.scale.setScalar(currentScale); 
                if (currentScale > 1.2 && state !== 3) {
                    ast.updateMatrixWorld(); let vec = new THREE.Vector3(); vec.setFromMatrixPosition(ast.matrixWorld); vec.project(camera);
                    if (vec.z > 1.0 || vec.z < -1.0) { ast.userData.label.style.opacity = 0; } else {
                        let screenX = (vec.x * 0.5 + 0.5) * window.innerWidth; let screenY = -(vec.y * 0.5 - 0.5) * window.innerHeight;
                        ast.userData.label.style.transform = `translate(-50%, -100%) translate(${screenX}px, ${screenY - 20}px)`; ast.userData.label.style.opacity = 1;
                    }
                } else { ast.userData.label.style.opacity = 0; }

                if (ast.userData.heartPoints) {
                    const hPoints = ast.userData.heartPoints; const hVels = ast.userData.heartVels; const positions = hPoints.geometry.attributes.position.array;
                    if (isHeartGesture || isTwoHandHeart) {
                        hPoints.material.opacity = Math.min(1.0, hPoints.material.opacity + 0.05);
                        for(let i=0; i<hVels.length; i++) {
                            hVels[i].life += 0.008; 
                            if (hVels[i].life > 1.0) { hVels[i].life = 0; positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0; } 
                            else { positions[i*3] += hVels[i].vx; positions[i*3+1] += hVels[i].vy; positions[i*3+2] += hVels[i].vz; }
                        }
                        hPoints.geometry.attributes.position.needsUpdate = true;
                    } else { hPoints.material.opacity = Math.max(0.0, hPoints.material.opacity - 0.05); }
                }
            });

            if (isRecovering) { let allRecovered = customAsteroids.every(a => a.userData.escapeState === 0); if (allRecovered) { isRecovering = false; noHeartTimer = 0; heartGestureTimer = 0; } }
            renderer.render(scene, camera);
        }

        // 视觉资源的容错降级
        const isMediaPipeLoaded = typeof Hands !== 'undefined' && typeof Camera !== 'undefined';

        if (window.isSecureContext === false) {
            loadingElement.style.display = 'none'; inputModeEl.innerText = "自动巡航 (无安全环境)"; customToast("⚠️ 摄像头手势需在 HTTPS 下运行。");
        } else if (isMediaPipeLoaded && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({maxNumHands: 2, modelComplexity: isMobile ? 0 : 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7});
            
            hands.onResults(res => {
                loadingElement.style.display = 'none'; 
                isHeartGesture = false; let detectedTwoHandHeart = false;

                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    isHandDetected = true; 

                    if (res.multiHandLandmarks.length === 2) {
                        const h1 = res.multiHandLandmarks[0]; const h2 = res.multiHandLandmarks[1];
                        const indexDist = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
                        const thumbDist = Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y);
                        if (indexDist < 0.15 && thumbDist < 0.15) detectedTwoHandHeart = true;
                    }

                    const h = res.multiHandLandmarks[0]; const d = Math.sqrt((h[4].x-h[8].x)**2 + (h[4].y-h[8].y)**2);
                    
                    if (detectedTwoHandHeart) {
                        isTwoHandHeart = true;
                    } else {
                        isTwoHandHeart = false;
                        targetScale = 0.15 + Math.max(0, Math.min(1, (d - 0.02) / 0.25)) * 2.35;
                        targetRotX = -0.6 + Math.max(0, Math.min(1, (h[9].y - 0.1) / 0.8)) * 1.6;
                        isHeartGesture = (d < 0.06 && h[12].y > h[10].y && h[16].y > h[14].y);
                    }
                } else { isHandDetected = false; isTwoHandHeart = false; }
            });

            const cam = new Camera(videoElement, {onFrame: async () => await hands.send({image: videoElement}), width: 640, height: 480});
            
            let cameraStarted = false;
            const startTimeout = setTimeout(() => {
                if(!cameraStarted) {
                    loadingElement.style.display = 'none'; 
                    inputModeEl.innerText = "摄像头启动超时"; 
                    customToast("⚠️ 摄像头加载超时，已降级为自动巡航。");
                }
            }, CONFIG.MEDIAPIPE_TIMEOUT_MS);

            cam.start().then(() => {
                cameraStarted = true;
                clearTimeout(startTimeout);
            }).catch(e => { 
                clearTimeout(startTimeout);
                loadingElement.style.display = 'none'; inputModeEl.innerText = "无权限"; customToast("⚠️ 无法获取摄像头权限。"); 
            });
        } else {
            loadingElement.style.display = 'none'; 
            inputModeEl.innerText = "资源或API不支持"; 
            customToast("⚠️ 核心资源加载失败或设备不支持，已降级为自动巡航。");
        }

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }
        initThree();
    </script>
</body>
