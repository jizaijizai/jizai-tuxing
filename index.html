    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size; attribute vec3 customColor; attribute float opacityAttr; attribute float orbitSpeed; attribute float isRing; attribute float aRandomId;
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        
        uniform float uTime; uniform float uScale; uniform float uRotationX; uniform float uHeartMorph;
        uniform float uLotteryState; 
        uniform float uLeaveProgress;
        uniform float uEnterProgress;
        uniform float uDecelAngle;
        uniform float uBreakAngle;
        uniform float uRingTime;

        mat2 rotate2d(float _angle){ return mat2(cos(_angle),-sin(_angle), sin(_angle),cos(_angle)); }
        
        // 【绝对物理同步核心】
        vec3 getLotteryPosition(vec3 origPos, float R, float baseTh, float spd) {
            float animTh = baseTh + uRingTime * spd * 0.2;
            
            if (uLotteryState <= 2.5) {
                return vec3(R * cos(animTh), origPos.y, R * sin(animTh));
            }
            
            // [顺时针离开]：增加角度
            if (uLotteryState < 3.5) {
                // 计算当前点落后于断口（顺时针方向）的距离
                float d = mod(uBreakAngle - animTh, 6.2831853);
                if (d < 0.0) d += 6.2831853;
                
                if (uLeaveProgress > d * R) {
                    float factor = uLeaveProgress - d * R;
                    // 脱离后向右匀速飞去（X变大）
                    return vec3(R * cos(uBreakAngle) + factor, origPos.y, R * sin(uBreakAngle));
                } else {
                    // 未脱离部分顺时针加速被带走
                    float newPhi = animTh + uLeaveProgress / R;
                    return vec3(R * cos(newPhi), origPos.y, R * sin(newPhi));
                }
            }
            
            // [逆时针回补圆环并减速]：减小角度
            float d = mod(uBreakAngle - animTh, 6.2831853);
            if (d < 0.0) d += 6.2831853;
            
            float OFFSET = 400.0;
            float totalProgress = uEnterProgress + uDecelAngle * R;
            float distToHit = OFFSET + d * R;
            
            if (totalProgress > distToHit) {
                // 原点正上方为起始锚点（-PI/2），角度随进度逆时针衰减
                float newPhi = -1.5707963 - (totalProgress - distToHit) / R;
                return vec3(R * cos(newPhi), origPos.y, R * sin(newPhi));
            } else {
                // 未切入部分由右向左平移直飞
                return vec3(distToHit - totalProgress, origPos.y, -R);
            }
        }

        float hash(float n) { return fract(sin(n) * 43758.5453123); }

        void main() {
            float normScaleLOD = clamp((uScale - 0.15) / 2.35, 0.0, 1.0);
            float visibilityThreshold = 0.9 + pow(normScaleLOD, 1.2) * 0.1; 
            if (aRandomId > visibilityThreshold) { gl_Position = vec4(0.0); gl_PointSize = 0.0; return; }
            
            vec3 pos = position;
            float R = length(pos.xz);
            float baseTh = atan(pos.z, pos.x);

            if (uLotteryState > 0.5 && isRing > 0.5) {
                pos = getLotteryPosition(pos, R, baseTh, orbitSpeed);
            } else if (uLotteryState > 0.5 && isRing < 0.5) {
                // 冻结土星中心产生景深虚化
                vec2 rotatedXZ = rotate2d(0.0) * pos.xz;
                pos.x = rotatedXZ.x * 0.85; pos.z = rotatedXZ.y * 0.85; pos.y *= 0.85;
            } else {
                float animTh = baseTh + uRingTime * orbitSpeed * 0.2;
                if (isRing > 0.5) {
                    vec2 circPos = vec2(cos(animTh), sin(animTh)) * R;
                    float hx = pow(sin(animTh), 3.0);
                    float hz = -(13.0*cos(animTh) - 5.0*cos(2.0*animTh) - 2.0*cos(3.0*animTh) - cos(4.0*animTh)) / 16.0;
                    vec2 heartPos = vec2(hx, hz) * R * 1.2; 
                    vec2 finalXZ = mix(circPos, heartPos, uHeartMorph);
                    pos.x = finalXZ.x; pos.z = finalXZ.y;
                } else {
                    float bodyAngle = uRingTime * 0.03;
                    vec2 rotatedXZ = rotate2d(bodyAngle) * pos.xz; pos.x = rotatedXZ.x; pos.z = rotatedXZ.y;
                }
            }
            
            float cx = cos(uRotationX); float sx = sin(uRotationX);
            float ry = pos.y * cx - pos.z * sx; float rz = pos.y * sx + pos.z * cx;
            pos.y = ry; pos.z = rz;
            
            vec4 mvPosition = modelViewMatrix * vec4(pos * uScale, 1.0);
            float dist = -mvPosition.z; vDist = dist; float chaosThreshold = 25.0; 
            if (dist < chaosThreshold && dist > 0.1 && uLotteryState == 0.0) {
                float chaosIntensity = 1.0 - (dist / chaosThreshold); chaosIntensity = pow(chaosIntensity, 3.0);
                float highFreqTime = uTime * 40.0; 
                float noiseX = sin(highFreqTime + pos.x * 10.0) * hash(pos.y); float noiseY = cos(highFreqTime + pos.y * 10.0) * hash(pos.x); float noiseZ = sin(highFreqTime * 0.5) * hash(pos.z);
                mvPosition.xyz += vec3(noiseX, noiseY, noiseZ) * chaosIntensity * 3.0;
            }
            gl_Position = projectionMatrix * mvPosition;
            
            float pointSize = size * (350.0 / dist); pointSize *= 0.55; 
            if (isRing < 0.5 && dist < 50.0) pointSize *= 0.8; 
            if (uLotteryState >= 2.5 && isRing < 0.5) { pointSize *= 1.8; } 
            gl_PointSize = clamp(pointSize, 0.0, 300.0);
            vColor = customColor; vOpacity = opacityAttr; vScaleFactor = uScale; vIsRing = isRing;
        }
    </script>
    
    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor; varying float vDist; varying float vOpacity; varying float vScaleFactor; varying float vIsRing;
        uniform float uLotteryState;
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0; float r = dot(cxy, cxy); if (r > 1.0) discard;
            float glow = smoothstep(1.0, 0.4, r); float t = clamp((vScaleFactor - 0.15) / 2.35, 0.0, 1.0);
            vec3 deepGold = vec3(0.35, 0.22, 0.05); float colorMix = smoothstep(0.1, 0.9, t);
            vec3 baseColor = mix(deepGold, vColor, colorMix); float brightness = 0.2 + 1.0 * t; float densityAlpha = 0.25 + 0.45 * smoothstep(0.0, 0.5, t);
            vec3 finalColor = baseColor * brightness;
            if (vDist < 40.0) { float closeMix = 1.0 - (vDist / 40.0); if (vIsRing < 0.5) { vec3 deepTexture = pow(vColor, vec3(1.4)) * 1.5; finalColor = mix(finalColor, deepTexture, closeMix * 0.8); } else { finalColor += vec3(0.15, 0.12, 0.1) * closeMix; } }
            float depthAlpha = 1.0; if (vDist < 10.0) depthAlpha = smoothstep(0.0, 10.0, vDist);
            float finalOpacity = glow * vOpacity * densityAlpha * depthAlpha;
            
            if (uLotteryState >= 2.5 && vIsRing < 0.5) { finalColor *= 0.45; finalOpacity *= 0.55; }
            gl_FragColor = vec4(finalColor, finalOpacity);
        }
    </script>
    
    <script type="x-shader/x-vertex" id="starVertexShader">
        attribute float size; attribute vec3 customColor; uniform float uTime; varying vec3 vColor;
        void main() { vColor = customColor; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); float dist = -mvPosition.z; gl_PointSize = clamp(size * (1000.0 / dist), 1.0, 8.0); gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="starFragmentShader">
        varying vec3 vColor; uniform float uTime; float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        void main() { vec2 cxy = 2.0 * gl_PointCoord - 1.0; if (dot(cxy, cxy) > 1.0) discard; float noise = random(gl_FragCoord.xy); float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + noise * 10.0); float glow = pow(1.0 - dot(cxy,cxy), 1.5); gl_FragColor = vec4(vColor * twinkle, glow * 0.8); }
    </script>
    <script type="x-shader/x-vertex" id="planetVertexShader">
        varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition; }
    </script>
    <script type="x-shader/x-fragment" id="planetFragmentShader">
        uniform vec3 color1; uniform vec3 color2; uniform float noiseScale; uniform vec3 lightDir; uniform float atmosphere; varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition;
        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); } float noise(vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; } float fbm(vec2 st) { float value = 0.0; float amplitude = 0.5; for (int i = 0; i < 5; i++) { value += amplitude * noise(st); st *= 2.0; amplitude *= 0.5; } return value; }
        void main() { float n = fbm(vUv * noiseScale); vec3 albedo = mix(color1, color2, n); vec3 normal = normalize(vNormal); vec3 light = normalize(lightDir); float diff = max(dot(normal, light), 0.05); vec3 viewDir = normalize(vViewPosition); float fresnel = pow(1.0 - dot(viewDir, normal), 3.0); vec3 finalColor = albedo * diff + atmosphere * vec3(0.5, 0.6, 1.0) * fresnel; gl_FragColor = vec4(finalColor, 1.0); }
    </script>

    <script>
        const CONFIG = {
            MAX_ASTEROIDS: 100, PARTICLE_COUNT_DESKTOP: 1200000, PARTICLE_COUNT_MOBILE: 400000,
            TRAIL_MAX_PARTICLES: 3000, PLANET_RADIUS: 18, RESIZE_DEBOUNCE_MS: 200, MEDIAPIPE_TIMEOUT_MS: 15000
        };

        let lotteryState = 0; 
        let lotteryTimer = 0;
        let lotteryGestureHoldTimer = 0;
        let isLotteryGestureActive = false;
        
        let lotteryBreakAngle = 0;
        let lotteryLeaveProgress = 0;
        let lotteryEnterProgress = 0;
        let lotteryDecelAngle = 0;
        let totalDecelAngle = 0;

        let lotterySelectedAst = null;
        let lotteryHistory = [];
        let lotteryCopyTexts = ["星星之所以美丽，\n\n是因为有你在看。"];
        let currentCopyText = "";
        let uRingTime = 0; 

        fetch('文案.txt').then(r => r.text()).then(t => {
            let texts = t.split('\n\n').map(s => s.trim()).filter(s => s.length > 0);
            if (texts.length > 0) lotteryCopyTexts = texts;
        }).catch(e => console.log("使用预设默认文案"));

        function customToast(msg) {

                        if (((isThumbUpPose(h1) && isHalfHeartPose(h2)) || (isThumbUpPose(h2) && isHalfHeartPose(h1))) && customAsteroids.length > 0) { isLotteryGestureActive = true; } else { isLotteryGestureActive = false; }
                        const indexDist = getDist(h1[8], h2[8]); const thumbDist = getDist(h1[4], h2[4]); if (indexDist < 0.15 && thumbDist < 0.15) detectedTwoHandHeart = true;
                    } else { isLotteryGestureActive = false; }
                    const h = res.multiHandLandmarks[0]; const d = getDist(h[4], h[8]);
                    if (detectedTwoHandHeart) { isTwoHandHeart = true; } else { isTwoHandHeart = false; if(lotteryState === 0) { targetScale = 0.15 + Math.max(0, Math.min(1, (d - 0.02) / 0.25)) * 2.35; targetRotX = -0.6 + Math.max(0, Math.min(1, (h[9].y - 0.1) / 0.8)) * 1.6; } isHeartGesture = (d < 0.06 && h[12].y > h[10].y && h[16].y > h[14].y); }
                } else { isHandDetected = false; isTwoHandHeart = false; isLotteryGestureActive = false; }
            });
            const startTimeout = setTimeout(() => { if(!cameraStarted) { document.getElementById('loading').style.display = 'none'; document.getElementById('input-mode').innerText = "摄像头启动超时"; customToast("⚠️ 摄像头加载超时，已降级为自动巡航。"); } }, CONFIG.MEDIAPIPE_TIMEOUT_MS);
            startCustomCamera();
        } else { document.getElementById('loading').style.display = 'none'; document.getElementById('input-mode').innerText = "资源或API不支持"; customToast("⚠️ 核心资源加载失败或设备不支持，已降级为自动巡航。"); }

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }
        initThree();
    </script>
